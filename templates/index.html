<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Search Visualizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; display: flex; margin: 0; height: 100vh; }
        #sidebar { width: 350px; padding: 20px; background: #f4f4f4; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 1000; overflow-y: auto;}
        #map { flex-grow: 1; height: 100%; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, button { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px;}
        button:hover { background: #0056b3; }
        .results { margin-top: 20px; padding: 10px; background: white; border-radius: 5px; display: none;}
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Search Visualizer</h2>
    <div class="form-group">
        <label>Source City</label>
        <select id="source">
            {% for node in nodes %}
            <option value="{{ node }}">{{ node }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label>Destination City</label>
        <select id="destination">
            {% for node in nodes %}
            <option value="{{ node }}">{{ node }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label>Search Algorithm</label>
        <select id="algorithm">
            <option value="bfs">Breadth-First Search (BFS)</option>
            <option value="dfs">Depth-First Search (DFS)</option>
            <option value="ucs">Uniform Cost Search (UCS)</option>
            <option value="ids">Iterative Deepening Search (IDS)</option>
            <option value="greedy">Greedy Best-First Search</option>
            <option value="astar">A* Search</option>
            <option value="sma_star">SMA* Search</option>
        </select>
    </div>
    
    <button onclick="runSearch()">Find Path</button>
    
    <div id="results" class="results">
        <h3>Results</h3>
        <p><strong>Path Cost:</strong> <span id="cost"></span> meters</p>
        <p><strong>Nodes Expanded:</strong> <span id="expanded"></span></p>
        <div style="margin-top:15px; padding: 10px; background:#e9ecef; border-left:4px solid #007BFF;">
            <strong>Algorithm Concept:</strong><br>
            <span id="note"></span>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize map centered roughly on the USA
    const map = L.map('map').setView([41.8781, -87.6298], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let currentPolyline = null;
    let markers = [];

    async function runSearch() {
        const source = document.getElementById('source').value;
        const destination = document.getElementById('destination').value;
        const algorithm = document.getElementById('algorithm').value;

        const response = await fetch('/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source, destination, algorithm })
        });
        
        const data = await response.json();
        
        if (data.error) {
            alert(data.error);
            return;
        }

        // Display Data in Sidebar
        document.getElementById('results').style.display = 'block';
        document.getElementById('cost').innerText = data.cost;
        document.getElementById('expanded').innerText = data.expanded;
        document.getElementById('note').innerText = data.note;

        // Clear old map layers
        if (currentPolyline) map.removeLayer(currentPolyline);
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        // Draw new route
        const latlngs = data.coords.map(c => [c.lat, c.lon]);
        currentPolyline = L.polyline(latlngs, {color: 'red', weight: 4}).addTo(map);
        map.fitBounds(currentPolyline.getBounds(), {padding: [50, 50]});

        // Add markers for source and destination
        markers.push(L.marker(latlngs[0]).addTo(map).bindPopup("Source: " + source));
        markers.push(L.marker(latlngs[latlngs.length - 1]).addTo(map).bindPopup("Destination: " + destination));
    }
</script>
</body>
</html>
