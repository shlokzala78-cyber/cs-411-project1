<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Search Visualizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; display: flex; margin: 0; height: 100vh; background-color: #f8fafc; }
        #sidebar { width: 380px; padding: 20px; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 1000; overflow-y: auto;}
        #map { flex-grow: 1; height: 100%; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }
        select, button { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #cbd5e1; }
        button { background: #0ea5e9; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 15px; }
        button:hover { background: #0284c7; }
        
        /* Card Styling */
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            display: none; /* Hidden until search */
        }
        .card h3 { margin-top: 0; color: #0f172a; font-size: 16px; margin-bottom: 12px; }
        
        /* Concept Note Rows */
        .concept-row { margin-bottom: 10px; font-size: 14px; color: #475569; line-height: 1.5; }
        .concept-row strong { color: #0f172a; }
        
        /* Result Stats Rows */
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #475569; }
        .stat-val { font-weight: bold; color: #0f172a; }
        
        .path-container { margin-top: 15px; font-size: 14px; color: #475569; line-height: 1.6; }
        .path-container strong { color: #0f172a; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="color: #0f172a; margin-top: 0;">Search Visualizer</h2>
    <div class="form-group">
        <label>Source City</label>
        <select id="source">
            {% for node in nodes %}
            <option value="{{ node }}">{{ node }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label>Destination City</label>
        <select id="destination">
            {% for node in nodes %}
            <option value="{{ node }}">{{ node }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label>Search Algorithm</label>
        <select id="algorithm">
            <option value="bfs">Breadth-First Search (BFS)</option>
            <option value="dfs">Depth-First Search (DFS)</option>
            <option value="ucs">Uniform Cost Search (UCS)</option>
            <option value="ids">Iterative Deepening Search (IDS)</option>
            <option value="greedy">Greedy Best-First Search</option>
            <option value="astar">A* Search</option>
        </select>
    </div>
    
    <button onclick="runSearch()">Find Path</button>
    
    <!-- Algorithm Concept Card -->
    <div id="concept-card" class="card">
        <h3>Algorithm Concept Note</h3>
        <div class="concept-row"><strong>Main Idea:</strong> <span id="note-main"></span></div>
        <div class="concept-row"><strong>Node Selection:</strong> <span id="note-node"></span></div>
        <div class="concept-row"><strong>Information Used:</strong> <span id="note-info"></span></div>
    </div>

    <!-- Results Card -->
    <div id="results-card" class="card">
        <h3>Results</h3>
        <div class="stat-row">
            <span>Total Cost:</span>
            <span class="stat-val" id="cost"></span>
        </div>
        <div class="stat-row">
            <span>Nodes Expanded:</span>
            <span class="stat-val" id="expanded"></span>
        </div>
        <div class="path-container">
            <strong>Path:</strong>
            <span id="path-display"></span>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([41.8781, -87.6298], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    const graphData = {{ graph_data | tojson | safe }};
    let currentPolyline = null;
    let markers = [];

    // Draw background graph network
    Object.keys(graphData.nodes).forEach(node => {
        const loc1 = graphData.nodes[node];
        L.circleMarker([loc1.lat, loc1.lon], {radius: 5, color: '#007BFF', fillColor: '#007BFF', fillOpacity: 1})
         .addTo(map)
         .bindTooltip(node);
        
        if (graphData.edges[node]) {
            Object.keys(graphData.edges[node]).forEach(neighbor => {
                const loc2 = graphData.nodes[neighbor];
                L.polyline([[loc1.lat, loc1.lon], [loc2.lat, loc2.lon]], {color: 'grey', weight: 2, opacity: 0.6}).addTo(map);
            });
        }
    });

    async function runSearch() {
        const source = document.getElementById('source').value;
        const destination = document.getElementById('destination').value;
        const algorithm = document.getElementById('algorithm').value;

        const response = await fetch('/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source, destination, algorithm })
        });
        
        const data = await response.json();
        
        if (data.error) {
            alert(data.error);
            return;
        }

        // Show Cards
        document.getElementById('concept-card').style.display = 'block';
        document.getElementById('results-card').style.display = 'block';

        // Populate Results Card
        document.getElementById('cost').innerText = data.cost;
        document.getElementById('expanded').innerText = data.expanded;
        document.getElementById('path-display').innerText = data.path.join(' -> ');

        // Populate Concept Card
        document.getElementById('note-main').innerText = data.note.main_idea;
        document.getElementById('note-node').innerText = data.note.node_selection;
        document.getElementById('note-info').innerText = data.note.info_used;

        // Map updates
        if (currentPolyline) map.removeLayer(currentPolyline);
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        const latlngs = data.coords.map(c => [c.lat, c.lon]);
        currentPolyline = L.polyline(latlngs, {color: 'green', weight: 5, opacity: 1}).addTo(map);
        
        markers.push(L.marker(latlngs[0]).addTo(map).bindPopup("Source: " + source).openPopup());
        markers.push(L.marker(latlngs[latlngs.length - 1]).addTo(map).bindPopup("Destination: " + destination));
    }
</script>
</body>
</html>
